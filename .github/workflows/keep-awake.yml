# Render's free plan sleeps a service after 15 idle minutes.
# This pings the web app and the API every 5 minutes so both stay awake.
# Override the URLs with repo variables RENDER_WEB_URL / RENDER_API_URL if the service names change.
name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping web and API
        env:
          WEB_URL: ${{ vars.RENDER_WEB_URL || 'https://pramaan-web-5rev.onrender.com' }}
          API_URL: ${{ vars.RENDER_API_URL || 'https://pramaan-api-5rev.onrender.com' }}
        run: |
          for url in "${API_URL%/}/api/health" "${WEB_URL%/}/login"; do
            for attempt in 1 2 3; do
              status=$(curl -s -L -o /dev/null -m 90 -w "%{http_code}" "$url" || echo "000")
              echo "[$(date -u +%H:%M:%S)] $url -> HTTP $status (attempt $attempt)"
              [ "$status" = "200" ] && break
              sleep 20
            done
          done
